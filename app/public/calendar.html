<!doctype html><html lang="th" class="role-routing"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>นัดหมายและติดตาม</title><link rel="stylesheet" href="/app.css"><style>
.calendar-shell{max-width:1280px;margin:auto;padding:12px}.calendar-tabs,.follow-controls,.appt-actions,.date-jumps{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.calendar-tabs{margin-bottom:12px}.calendar-tabs .on{background:var(--blue);color:white}.cols{grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr)}.cal-head{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px}.cal-head b{font-size:20px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.cal-dow{text-align:center;font-size:13px;color:var(--dim)}button.cal-cell{border:1px solid var(--line);border-radius:10px;min-height:76px;padding:6px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer}.cal-cell.today{outline:2px solid var(--blue)}.cal-cell.sel{background:var(--blue-soft)}.cal-cell .d{font-weight:700}.cal-count{display:block;font-size:12px;margin-top:9px;color:var(--blue);font-weight:700}.cal-cell.busy{border-bottom:4px solid #d18b00}.appt-item{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}.appt-item .nm{font-weight:700}.appt-item .sub{font-size:13px;color:var(--dim);overflow-wrap:anywhere}.appt-phone{font-size:17px;font-weight:700;margin:5px 0}.appt-actions{margin-top:10px}.appt-state{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:7px;background:var(--blue-soft);font-size:13px}.appt-state.missed{background:#fff1d6;color:#825800}.follow-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.follow-controls #followSearch{min-width:180px;flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}.follow-controls label:last-child{display:flex;align-items:center;gap:7px}.follow-controls input[type=checkbox]{width:16px;min-width:0;flex:none}.history-event{border-left:3px solid var(--blue);padding:7px 12px;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.contact-form{border:0;padding:0;margin:0}.contact-form:disabled{opacity:.7}.date-jumps{margin:9px 0}.appointment-result{scroll-margin-top:calc(var(--topbar-h,60px) + 12px);padding:12px;border:1px solid var(--blue);border-radius:10px;background:var(--blue-soft);margin-bottom:12px;overflow-wrap:anywhere}.calendar-help{font-size:13px;color:var(--dim)}.mini-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:8px 0}.mini-days button{padding:5px 2px;min-height:40px}.mini-days small{display:block;font-size:10px}.follow-title{font-size:19px}.follow-counts{font-size:14px;color:var(--dim)}@media(max-width:1000px){.cols,.follow-columns{grid-template-columns:1fr}}@media(max-width:480px){.calendar-shell{padding:6px}.cal-grid{gap:3px}button.cal-cell{min-height:64px;padding:4px}.cal-count{font-size:10px}.cal-head .btn{font-size:13px}}
</style></head><body><div id="backupBanner"></div><main class="calendar-shell">
<div class="calendar-tabs"><button class="btn on" id="calendarTab" onclick="setAppointmentTab('calendar')">📅 ปฏิทินนัด</button><button class="btn" id="followupTab" onclick="setAppointmentTab('followup')">☎ ติดตามนัด</button><button class="btn" onclick="reloadAppointments()">↻ โหลดรายการล่าสุด</button></div>
<div id="appointmentResult" class="appointment-result hidden" role="status" aria-live="polite"></div>
<section id="calendarView" class="cols"><div class="card"><div class="cal-head"><button class="btn" onclick="moveMonth(-1)">← เดือนก่อน</button><b id="calTitle"></b><button class="btn" onclick="moveMonth(1)">เดือนถัดไป →</button><button class="btn" onclick="goToday()">วันนี้</button></div><div class="cal-grid" id="calGrid"></div><p class="calendar-help mt">กดวันเพื่อดูรายชื่อ · จำนวนคนแสดงในแต่ละวัน · เส้นสีส้ม = วันที่มีนัดมากที่สุดในเดือนนี้</p></div><div class="card"><h2 id="dayTitle">เลือกวันจากปฏิทิน</h2><div class="stack" id="dayList"></div></div></section>
<section id="followupView" class="hidden"><div class="card"><div class="follow-controls"><label>ย้อนหลัง <select id="followDays" onchange="loadFollowup()"><option value="7">7 วัน</option><option value="14">14 วัน</option><option value="30" selected>30 วัน</option><option value="90">90 วัน</option></select></label><input id="followSearch" placeholder="ค้นชื่อ / HN / เบอร์โทร" oninput="renderFollowup()"><label><input id="followPending" type="checkbox" onchange="renderFollowup()"> เฉพาะที่ยังไม่บันทึกการติดต่อ</label></div><p class="calendar-help mt">นัดที่ผ่านมาแต่ยังไม่ยืนยัน จะแยกจากรายการที่เจ้าหน้าที่ยืนยันว่าขาดนัด · ผลการโทรไม่เปลี่ยนสถานะการมาเอง</p><div id="followCounts" class="follow-counts"></div></div><div class="follow-columns"><div class="card"><h2 class="follow-title">ถึงวันนัดแล้ว / รอติดตาม</h2><div id="pastFollowList" class="stack"></div></div><div class="card"><h2 class="follow-title">ใกล้ถึงนัดใน 3 วันข้างหน้า</h2><div id="upcomingFollowList" class="stack"></div></div></div></section>
</main><script src="/common.js"></script><script src="/appointments.js"></script></body></html>
