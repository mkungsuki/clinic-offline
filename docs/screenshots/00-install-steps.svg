<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <style>
    text{font-family:"Segoe UI",Tahoma,sans-serif;fill:#18343e}.title{font-size:40px;font-weight:700;fill:#0c5963}.h{font-size:25px;font-weight:700}.body{font-size:19px}.small{font-size:16px;fill:#50666f}.step{font-size:24px;font-weight:800;fill:white}.btn{font-size:18px;font-weight:600}.white{fill:white}
  </style>
  <rect width="1400" height="980" fill="#eef4f7"/>
  <text x="50" y="70" class="title">ติดตั้งตามภาพทีละขั้น</text>
  <rect x="1080" y="32" width="270" height="52" rx="26" fill="#ffe9a8"/><text x="1120" y="66" class="body" font-weight="700">ภาพจำลองหน้าจอ Windows</text>

  <g transform="translate(50 115)"><rect width="635" height="350" rx="18" fill="white" stroke="#d4e1e5"/><rect width="635" height="50" rx="18" fill="#e8eef2"/><rect y="32" width="635" height="18" fill="#e8eef2"/><text x="20" y="32" class="small">ClinicTrial.zip Properties</text>
    <circle cx="48" cy="92" r="22" fill="#087b83"/><text x="41" y="101" class="step">1</text><text x="82" y="101" class="h">ปลดการบล็อกไฟล์</text>
    <rect x="30" y="125" width="575" height="130" rx="10" fill="#fbfcfd" stroke="#b8c7cd"/><text x="50" y="160" class="body" font-weight="700">Security</text><rect x="52" y="182" width="20" height="20" fill="white" stroke="#61747b" stroke-width="2"/><path d="M55 192 l7 7 14-18" fill="none" stroke="#087b83" stroke-width="4"/><text x="85" y="200" class="body">Unblock (ยกเลิกการบล็อก)</text><rect x="505" y="214" width="75" height="30" rx="4" fill="#0878d1"/><text x="526" y="236" class="btn white">OK</text>
    <text x="30" y="292" class="small">คลิกขวา ZIP → Properties → ติ๊ก Unblock → OK</text><text x="30" y="320" class="small">ถ้าไม่มีช่องนี้ ให้ข้ามไปขั้นถัดไปได้เลย</text>
  </g>

  <g transform="translate(715 115)"><rect width="635" height="350" rx="18" fill="white" stroke="#d4e1e5"/><rect width="635" height="50" rx="18" fill="#e8eef2"/><rect y="32" width="635" height="18" fill="#e8eef2"/><text x="20" y="32" class="small">เมนูคลิกขวา</text>
    <circle cx="48" cy="92" r="22" fill="#087b83"/><text x="41" y="101" class="step">2</text><text x="82" y="101" class="h">แตกไฟล์ทั้งหมด</text>
    <rect x="30" y="125" width="575" height="130" rx="10" fill="#fbfcfd" stroke="#b8c7cd"/><text x="50" y="158" class="body">Open</text><rect x="40" y="170" width="545" height="45" fill="#e7f2fb"/><rect x="40" y="170" width="5" height="45" fill="#0878d1"/><text x="58" y="200" class="body" font-weight="700">Extract All… (แตกไฟล์ทั้งหมด)</text><text x="50" y="240" class="body">Properties</text>
    <text x="30" y="292" class="small">ห้ามเปิดตัวติดตั้งจากในหน้าต่าง ZIP โดยตรง</text><text x="30" y="320" class="small">ต้อง Extract All ให้เสร็จก่อน</text>
  </g>

  <g transform="translate(50 500)"><rect width="635" height="350" rx="18" fill="#0067b8"/><text x="20" y="34" class="small white">Windows protected your PC</text>
    <circle cx="48" cy="92" r="22" fill="white"/><text x="41" y="101" class="step" fill="#0067b8" style="fill:#0067b8">3</text><text x="82" y="101" class="h white">ถ้าพบกล่องสีฟ้า</text>
    <text x="35" y="150" class="body white">กด More info ก่อน แล้วปุ่ม Run anyway จะปรากฏ</text><text x="35" y="188" class="body white" text-decoration="underline" font-weight="700">More info</text>
    <rect x="35" y="225" width="125" height="44" rx="4" fill="white"/><text x="49" y="254" class="btn" fill="#0067b8" style="fill:#0067b8">Run anyway</text><rect x="178" y="225" width="112" height="44" rx="4" fill="#e5edf4"/><text x="198" y="254" class="btn">Don’t run</text>
    <text x="35" y="309" class="small white">Windows อาจถามยืนยันเฉพาะครั้งแรก เพราะชุดติดตั้งไม่ได้เซ็น</text><text x="35" y="334" class="small white">ด้วยใบรับรองเชิงพาณิชย์</text>
  </g>

  <g transform="translate(715 500)"><rect width="635" height="350" rx="18" fill="white" stroke="#d4e1e5"/><rect width="635" height="50" rx="18" fill="#e8eef2"/><rect y="32" width="635" height="18" fill="#e8eef2"/><text x="20" y="32" class="small">โฟลเดอร์ Clinic ทดลอง</text>
    <circle cx="48" cy="92" r="22" fill="#087b83"/><text x="41" y="101" class="step">4</text><text x="82" y="101" class="h">เปิดตัวติดตั้ง</text>
    <rect x="28" y="127" width="580" height="48" rx="7" fill="#dcebee"/><text x="45" y="159" class="body" font-weight="700">ติดตั้งระบบคลินิก.cmd — ดับเบิลคลิกไฟล์นี้</text>
    <text x="45" y="206" class="body">อ่านก่อนติดตั้ง.txt</text>
    <text x="45" y="250" class="body">ชุดโปรแกรม (ไม่ต้องเปิด)</text>
    <text x="45" y="289" class="small">เห็น 3 รายการ · กดเฉพาะไฟล์ติดตั้งด้านบน</text>
    <text x="40" y="326" class="small">รอจนเห็น “ติดตั้งเสร็จแล้ว” แล้วเปิดจากไอคอนบนหน้าจอ</text>
  </g>
  <rect x="160" y="890" width="1080" height="58" rx="14" fill="#dcebee"/><text x="215" y="926" class="body" font-weight="700">ชุดทดลองกับตัวจริงอยู่คนละบ้าน จึงเปิดพร้อมกันได้และข้อมูลไม่ปนกัน — ใช้ไอคอน ไม่ต้องจำเลขทางเข้า</text>
</svg>
